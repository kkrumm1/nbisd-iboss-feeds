name: Update afraid.org FreeDNS domain feed

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 3:17 AM Central (09:17 UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull FreeDNS registry
        run: python3 scripts/afraid_registry.py

      - name: Commit if changed
        run: |
          git config user.name  "nbisd-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add afraid_org_domains.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "afraid.org feed update $(date -u +%F) ($(wc -l < afraid_org_domains.txt) domains)"
            git push
          fi
