name: afraid debug
on: workflow_dispatch
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o p1.html -w "HTTP %{http_code} size %{size_download}\n" -A "Mozilla/5.0" "https://freedns.afraid.org/domain/registry/?page=1&sort=2&q="
          head -c 1500 p1.html; echo; echo ----
          grep -o "edit_domain_id[^<]*<" p1.html | head -5
          grep -oE "page=[0-9]+" p1.html | sort -u | tail -5
          grep -iE "domain/registry|<td" p1.html | head -20 | cut -c1-300
