name: Update free-subdomain registry hunting list

on:
  schedule:
    - cron: "23 10 * * *"   # daily, ~4:23 AM Central (before the 5:05 AM S&D run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build free_subdomain_registry.tsv
        run: python3 scripts/free_subdomains.py

      - name: Commit if changed
        run: |
          git config user.name  "nbisd-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add free_subdomain_registry.tsv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "free-subdomain registry $(date -u +%F) ($(($(wc -l < free_subdomain_registry.tsv)-1)) hosts)"
            git push
          fi
