name: Update afraid.org public domain feed

on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Accept a >10% change in domain count"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build public afraid.org list
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/afraid_mirror.py

      - name: Commit if changed
        run: |
          git config user.name  "nbisd-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add afraid_public_domains.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "afraid.org public feed $(date -u +%F) ($(wc -l < afraid_public_domains.txt) domains)"
            git push
          fi
