name: Update afraid.org domain feeds

on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Accept a >10% change in domain count"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build afraid.org lists (direct scrape, mirror as fallback)
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          if python3 scripts/afraid_scrape.py; then
            echo "SOURCE=direct scrape" >> "$GITHUB_ENV"
          else
            echo "::warning::Direct scrape failed - falling back to the 4ngel2769 mirror"
            python3 scripts/afraid_mirror.py
            echo "SOURCE=mirror" >> "$GITHUB_ENV"
          fi

      - name: Commit if changed
        run: |
          git config user.name  "nbisd-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add afraid_all_domains.txt afraid_public_domains.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "afraid.org feeds $(date -u +%F) via $SOURCE (all $(wc -l < afraid_all_domains.txt), public $(wc -l < afraid_public_domains.txt))"
            git push
          fi
